version = 1

[boot]
timeout = -1
default = "recovery-usb"
serial_commands = true

[kits]
autoload = false

[ui]
scale = 4

[[entry]]
id = "recovery-usb"
title = "Elden macOS 26.5 - Recovery"
type = "xnu"
path = "Payloads/kernel.macho"
args = "-v debug=0x14e keepsyms=1 cpus=1 -enable_kprintf_spam -sheng-early-console sheng-boot-progress=1 native-ufs-elden=1 native-ufs-root=1 native-ufs-diagnostics=1 sheng-stderr-log=2 sheng-stderr-name=launchd sheng-pid1-trace=1 native-gop-display=1 elden-gop-display=1 -elden-recovery-skip-ignition elden-usb-debug=1 elden-usb-management=1 elden-ufs-isc-sidecar=1 native-ufs-isc-overlay=1 elden-usb-run-timeout=900"

[[entry]]
id = "linux"
title = "Elden Linux - installed rootfs"
type = "linux"
path = "Payloads/linux.efi"
dtb = "Payloads/linux.dtb"
args = "root=PARTLABEL=rootfs"

[[entry]]
id = "restart"
title = "Restart"
type = "action"
action = "reset"

[[entry]]
id = "fastboot"
title = "Reboot to Fastboot"
type = "action"
action = "fastboot"

[[entry]]
id = "slot-status"
title = "Inspect boot slot"
type = "efi"
path = "Payloads/EldenBootSlot.efi"
args = "inspect"

[[entry]]
id = "slot-a"
title = "Switch directly to slot A and restart"
type = "efi"
path = "Payloads/EldenBootSlot.efi"
args = "a"
confirm = "Select slot A in UFS boot metadata and restart?"

[[entry]]
id = "slot-b"
title = "Switch directly to slot B and restart"
type = "efi"
path = "Payloads/EldenBootSlot.efi"
args = "b"
confirm = "Select slot B in UFS boot metadata and restart?"
