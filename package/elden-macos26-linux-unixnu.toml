version = 1

[boot]
timeout = -1
default = "native26"
serial_commands = true

[kits]
autoload = false

[ui]
scale = 4

[[entry]]
id = "native26"
title = "Elden macOS 26.5 - Recovery Framebuffer Test"
type = "xnu"
path = "Payloads/kernel.macho"
args = "-v debug=0x14e keepsyms=1 cpus=1 -enable_kprintf_spam -sheng-early-console sheng-boot-progress=1 native-ufs-elden=1 native-ufs-root=1 native-ufs-diagnostics=1 sheng-stderr-log=2 sheng-stderr-name=launchd sheng-pid1-trace=1 native-gop-display=1 elden-gop-display=1"

[[entry]]
id = "linux"
title = "Elden Linux - installed rootfs"
type = "linux"
path = "Payloads/linux.efi"
dtb = "Payloads/linux.dtb"
args = "root=PARTLABEL=rootfs"

[[entry]]
id = "fastboot"
title = "Reboot to Fastboot"
type = "action"
action = "fastboot"

[[entry]]
id = "slot-a"
title = "Switch to slot A and reboot (via Linux)"
type = "linux"
path = "Payloads/linux.efi"
dtb = "Payloads/linux.dtb"
args = "root=PARTLABEL=rootfs"

[entry.chosen]
"unixnu,boot-slot" = "a"

[[entry]]
id = "slot-b"
title = "Switch to slot B and reboot (via Linux)"
type = "linux"
path = "Payloads/linux.efi"
dtb = "Payloads/linux.dtb"
args = "root=PARTLABEL=rootfs"

[entry.chosen]
"unixnu,boot-slot" = "b"
